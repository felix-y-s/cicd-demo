name: CI

# main 브랜치로의 push와, main을 대상으로 하는 PR에서 실행
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # mongodb.integration.spec.ts, redis.integration.spec.ts,
    # rabbitmq-connection.integration.spec.ts가 실제 서버 연결을 필요로
    # 하므로(mock이 아니라 모듈을 실제로 부팅함), 4개 인프라를 전부
    # 러너 안에 임시 컨테이너로 띄운다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nest
          POSTGRES_PASSWORD: nest
          POSTGRES_DB: nest_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: nest
          MONGO_INITDB_ROOT_PASSWORD: nest
          MONGO_INITDB_DATABASE: nest_template
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # GitHub Actions의 services.options는 docker create 옵션만 받고
        # 컨테이너 실행 커맨드(CMD)는 오버라이드할 수 없다. 그래서
        # docker-compose.yml처럼 --requirepass로 비밀번호를 거는 것이
        # 불가능해, CI에서는 인증 없는 기본 Redis로 띄운다.
        # (RedisModule은 REDIS_PASSWORD가 비어 있으면 인증 없이 연결한다.)
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: nest
          RABBITMQ_DEFAULT_PASS: nest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nest:nest@localhost:5432/nest_template?schema=public
      MONGODB_URI: mongodb://nest:nest@localhost:27017/nest_template?authSource=admin
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      RABBITMQ_URL: amqp://nest:nest@localhost:5672
      JWT_SECRET: ci-test-only-32-characters-secret-key
      JWT_REFRESH_SECRET: ci-test-only-32-characters-refresh-key
      SWAGGER_ENABLED: 'false'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Node.js 설치 (pnpm 캐시 사용)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Lint 검사
        run: pnpm lint

      - name: Prisma 마이그레이션 적용
        run: npx prisma migrate deploy

      - name: 테스트 실행
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: Docker 이미지 빌드 검증
        run: docker build -t nest-cicd-demo:ci .

  # 이미지 크기 최적화(prod-deps 스테이지)에서 pnpm dlx로 Prisma 네이티브
  # 엔진을 실행하게 되면서, QEMU 에뮬레이션으로 돌리는 arm64 빌드가
  # "Illegal instruction (core dumped)"로 크래시하는 문제가 생겼다.
  # 에뮬레이션 대신 GitHub가 제공하는 네이티브 arm64 러너(ubuntu-24.04-arm)를
  # 써서 각 아키텍처를 독립적으로 빌드하는 방식으로 전환한다.
  # (이 저장소는 public이라 GitHub Actions 표준 러너가 무료로 무제한 제공된다.)
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 아키텍처별 이미지 빌드 및 push (다이제스트만 우선 생성)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # 태그 없이 다이제스트로만 push한다. 최종 latest/sha 태그는
          # merge-manifest job에서 두 다이제스트를 합쳐 붙인다.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: 다이제스트 아티팩트 저장
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-ghcr:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 다이제스트 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 메타데이터 추출 (태그/라벨)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      # amd64/arm64 각각 push된 다이제스트 두 개를 하나의 멀티플랫폼
      # 매니페스트로 묶어 최종 태그(latest, sha-*)를 붙인다.
      - name: 멀티플랫폼 매니페스트 생성 및 태그 부여
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: 최종 이미지 확인
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest

  deploy:
    # self-hosted: 이 Mac에 등록해 둔 러너(mac-local-runner)에서 실행된다.
    # GitHub의 클라우드 러너는 사설 IP인 로컬 배포 서버에 네트워크로 도달할
    # 수 없어서, 배포 서버와 같은 네트워크(이 Mac)에 있는 러너가 필요하다.
    runs-on: self-hosted
    needs: push-ghcr

    steps:
      - name: SSH 개인키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 배포 서버에서 최신 이미지 pull 및 재기동
        # 4단계에서 터미널로 직접 실행했던 절차를 그대로 스크립트화:
        # GHCR에서 새 이미지를 받아, 기존 컨테이너를 내리고 새로 띄운다.
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deployer@localhost bash -s <<'EOF'
            set -e
            docker pull ghcr.io/felix-y-s/cicd-demo:latest
            docker rm -f nest-app || true
            docker run -d --name nest-app \
              --add-host=host.docker.internal:192.168.65.254 \
              --env-file /home/deployer/app.env \
              -p 3000:3000 \
              ghcr.io/felix-y-s/cicd-demo:latest
          EOF

      - name: 배포 헬스체크
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deployer@localhost "curl -sf http://localhost:3000/ > /dev/null && echo '배포 성공: 앱이 정상 응답함'"

      - name: SSH 개인키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
