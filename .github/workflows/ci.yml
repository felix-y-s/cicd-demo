name: CI

# main 브랜치로의 push와, main을 대상으로 하는 PR에서 실행
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # mongodb.integration.spec.ts, redis.integration.spec.ts,
    # rabbitmq-connection.integration.spec.ts가 실제 서버 연결을 필요로
    # 하므로(mock이 아니라 모듈을 실제로 부팅함), 4개 인프라를 전부
    # 러너 안에 임시 컨테이너로 띄운다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nest
          POSTGRES_PASSWORD: nest
          POSTGRES_DB: nest_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: nest
          MONGO_INITDB_ROOT_PASSWORD: nest
          MONGO_INITDB_DATABASE: nest_template
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # GitHub Actions의 services.options는 docker create 옵션만 받고
        # 컨테이너 실행 커맨드(CMD)는 오버라이드할 수 없다. 그래서
        # docker-compose.yml처럼 --requirepass로 비밀번호를 거는 것이
        # 불가능해, CI에서는 인증 없는 기본 Redis로 띄운다.
        # (RedisModule은 REDIS_PASSWORD가 비어 있으면 인증 없이 연결한다.)
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: nest
          RABBITMQ_DEFAULT_PASS: nest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nest:nest@localhost:5432/nest_template?schema=public
      MONGODB_URI: mongodb://nest:nest@localhost:27017/nest_template?authSource=admin
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      RABBITMQ_URL: amqp://nest:nest@localhost:5672
      JWT_SECRET: ci-test-only-32-characters-secret-key
      JWT_REFRESH_SECRET: ci-test-only-32-characters-refresh-key
      SWAGGER_ENABLED: 'false'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Node.js 설치 (pnpm 캐시 사용)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Lint 검사
        run: pnpm lint

      - name: Prisma 마이그레이션 적용
        run: npx prisma migrate deploy

      - name: 테스트 실행
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: Docker 이미지 빌드 검증
        # 실제로 GHCR에 push하지는 않고, Dockerfile이 여전히 정상 빌드되는지만 검증한다.
        # push는 3단계(GHCR 배포)에서 별도 job으로 추가할 예정.
        run: docker build -t nest-cicd-demo:ci .
