name: Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # 이미지 크기 최적화(prod-deps 스테이지)에서 pnpm dlx로 Prisma 네이티브
  # 엔진을 실행하게 되면서, QEMU 에뮬레이션으로 돌리는 arm64 빌드가
  # "Illegal instruction (core dumped)"로 크래시하는 문제가 생겼다.
  # 에뮬레이션 대신 GitHub가 제공하는 네이티브 arm64 러너(ubuntu-24.04-arm)를
  # 써서 각 아키텍처를 독립적으로 빌드하는 방식으로 전환한다.
  # (이 저장소는 public이라 GitHub Actions 표준 러너가 무료로 무제한 제공된다.)
  build-and-push:

    # main 브랜치로 푸쉬되는 경우(PR 머지 포함)가 아니면 이 잡(build-and-push)은 여기서 멈춘다.
    # github.ref는 브랜치면 refs/heads/{브랜치명}, 태그면 refs/tags/{태그명} 형태를 가진다
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      # 저장소의 소스 코드 및 파일에 대한 읽기(Read) 권한을 부여
      contents: read
      # GitHub Packages(GHCR, GitHub Container Registry)에 대한 쓰기(Write/Push) 권한을 부여
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4 # <--- [준비] Buildx 빌더 엔진을 가상 머신에 셋팅

      - name: 아키텍처별 이미지 빌드 및 push (다이제스트만 우선 생성)
        id: build
        uses: docker/build-push-action@v7 # <--- [실제 실행] 전달받은 코드로 Docker 이미지를 빌드 및 푸쉬
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # 태그 없이 다이제스트로만 push한다. 최종 latest/sha 태그는
          # merge-manifest job에서 두 다이제스트를 합쳐 붙인다.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      # 현재 실행 중인 러너(runner) VM의 로컬 파일시스템
      # 예: /tmp/digests/abcd1234라는 이름의 내용 없는 파일 하나가 생성
      # ☝️ matrix 전략이라 amd64/arm64 각각 **별도 러너에서 독립 실행 중**이라는 점이 중요
      - name: 다이제스트 아티팩트 저장
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        # 동작 예시
        # digest="sha256:abcd1234efgh5678"
        # echo "${digest#sha256:}"
        # 결과: abcd1234efgh5678 (sha256:이라는 접두어(prefix)를 제거)

      #  /tmp/digests/의 파일들을 러너 밖의 GitHub이 관리하는 영구(단기) 저장소로 업로드
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  
  push-ghcr:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps:
      # build-and-push job에서 올린 임시 파일들을 /tmp/digests 에 다운로드
      - name: 다이제스트 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-* # digests-amd64, digests-arm64
          merge-multiple: true # /tmp/digests/<amd64 다이제스트 파일>, /tmp/digests/<arm64 다이제스트 파일>이 같은 폴더에 나란히 다운로드

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그로 쓸 텍스트(문자열)만 미리 계산해서 만들어 둠(steps.meta.outputs.tag에 저장됨)
      - name: 이미지 메타데이터 추출 (태그/라벨)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      # amd64/arm64 각각 push된 다이제스트 **두 개를 하나**의 멀티플랫폼
      # 매니페스트로 묶어 최종 태그(latest, sha-*)를 붙인다.
      - name: 멀티플랫폼 매니페스트 생성 및 태그 부여
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
        # .tags: JSON에서 tags 배열만 뽑음
        # map("-t " + .): 배열의 각 원소 앞에 "-t "를 붙임
        # join(" ") → 공백으로 이어붙여 하나의 문자열로 만듦
        # printf '...%s ' *는 셸의 glob 확장(*)으로 얻은 각 파일명을 %s 자리에 채워 넣으며 반복 출력
        # [최종 형태 예]
        # docker buildx imagetools create \
        #   -t ghcr.io/felix-y-s/cicd-demo:latest \           # ← 결과물 이름표 ①
        #   -t ghcr.io/felix-y-s/cicd-demo:sha-a1b2c3d \      # ← 결과물 이름표 ②
        #   ghcr.io/felix-y-s/cicd-demo@sha256:abcd1234... \  # ← 재료 1 (amd64 이미지)
        #   ghcr.io/felix-y-s/cicd-demo@sha256:efgh5678...    # ← 재료 2 (arm64 이미지)

      # GitHub Actions 빌드 로그 확인용 (Human Verification)
      - name: 최종 이미지 확인
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest
  deploy:
    # self-hosted: 이 Mac에 등록해 둔 러너(mac-local-runner)에서 실행된다.
    # GitHub의 클라우드 러너는 사설 IP인 로컬 배포 서버에 네트워크로 도달할
    # 수 없어서, 배포 서버와 같은 네트워크(이 Mac)에 있는 러너가 필요하다.
    runs-on: self-hosted
    needs: push-ghcr

    steps:
      - name: SSH 개인키 준비(등록)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 배포 서버에서 최신 이미지 pull 및 재기동
        # 4단계에서 터미널로 직접 실행했던 절차를 그대로 스크립트화:
        # GHCR에서 새 이미지를 받아, 기존 컨테이너를 내리고 새로 띄운다.
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deployer@localhost bash -s <<'EOF'
              set -e
              docker pull ghcr.io/felix-y-s/cicd-demo:latest
              docker rm -f nest-app || true
              docker run -d --name nest-app \
                --add-host=host.docker.internal:192.168.65.254 \
                --env-file /home/deployer/app.env \
                -p 3000:3000 \
                ghcr.io/felix-y-s/cicd-demo:latest
            EOF

      - name: 배포 헬스체크
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deployer@localhost "curl -sf http://localhost:3000/ > /dev/null && echo '배포 성공: 앱이 정상 응답함'"

      - name: SSH 개인키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key