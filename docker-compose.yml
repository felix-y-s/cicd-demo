services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules    # 컨테이너 내부 node_modules는 덮어쓰지 않도록 보호
    env_file: .env
    # .env의 DATABASE_URL 등은 localhost 기준(호스트에서 pnpm start:dev 실행 시 사용).
    # app이 컨테이너로 뜨면 컨테이너 안의 localhost는 app 자신을 가리키므로,
    # 같은 compose 네트워크 안에서는 서비스명(postgres, mongodb, redis, rabbitmq)이
    # 곧 호스트명이 된다 — 아래 environment로 .env 값을 덮어써 접속 대상을 바꾼다.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nest}:${POSTGRES_PASSWORD:-nest}@postgres:5432/${POSTGRES_DB:-nest_template}?schema=public
      MONGODB_URI: mongodb://${MONGO_USER:-nest}:${MONGO_PASSWORD:-nest}@mongodb:27017/${MONGO_DB:-nest_template}?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nest}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nest}:${RABBITMQ_PASSWORD:-nest}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    container_name: nest-template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nest}
      POSTGRES_DB: ${POSTGRES_DB:-nest_template}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nest}']
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: nest-template-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nest}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nest}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-nest_template}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nest-template-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-nest}']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-nest}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nest-template-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nest}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
